    <circle cx="230" cy="130" r="2" fill="#ffffff"/>
    <circle cx="300" cy="175" r="2" fill="#ffffff"/>
    <circle cx="360" cy="120" r="2" fill="#ffffff"/>
    <circle cx="420" cy="170" r="2" fill="#ffffff"/>
    <circle cx="490" cy="145" r="2" fill="#ffffff"/>
