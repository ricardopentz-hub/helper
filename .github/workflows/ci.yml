name: ci
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift (if needed)
        run: |
          # macOS runners already have Swift. If you need a specific toolchain, install it here.
          swift --version
      - name: Run tests
        run: |
          swift test

# Note: If you later want to run xcodebuild for the full Xcode project, replace `swift test` with an xcodebuild command.
